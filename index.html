
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maranguapeboyz RSS</title>

<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: white;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
  }

  #feed-lancamentos {
    text-align: center;
  }

  .faixa-card {
    background: rgba(0, 0, 0, 0.75);
    border: 2px ridge #ccc;
    padding: 8px;
    margin-bottom: 12px;
    text-align: center;
  }

  .faixa-card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border: 2px double white;
    margin-bottom: 6px;
  }

  .faixa-titulo {
    font-size: 12px;
    font-weight: bold;
    color: white;
    margin: 4px 0;
    overflow-wrap: anywhere;
  }

  .faixa-autor {
    font-size: 11px;
    color: #00ffff;
    margin-bottom: 6px;
  }

  .faixa-data {
    font-size: 10px;
    color: #aaa;
    margin-bottom: 6px;
  }

  .status-feed {
    color: #00ffff;
    font-size: 10px;
    margin-bottom: 10px;
  }

  .erro-feed {
    color: #ff7777;
    font-size: 10px;
    margin: 5px;
  }

  * {
    scrollbar-width: thin;
  }

  ::-webkit-scrollbar {
    width: 8px;
  }
</style>
</head>

<body>

<div id="feed-lancamentos">
  Carregando lançamentos...
</div>

<script>

// ======================================
// FEEDS DOS ARTISTAS
// ======================================

const feedsRSS = [
  {
    nome: 'santacruz4life',
    url: 'https://feeds.soundcloud.com/users/soundcloud:users:317924305/sounds.rss'
  },
  {
    nome: 'igniskpt',
    url: 'https://feeds.soundcloud.com/users/soundcloud:users:945631423/sounds.rss'
  },
  {
    nome: '081SEMFUTURO',
    url: 'https://feeds.soundcloud.com/users/soundcloud:users:868049731/sounds.rss'
  },
  {
    nome: 'marquinhos ak trovão',
    url: 'https://feeds.soundcloud.com/users/soundcloud:users:1353337512/sounds.rss'
  },
  {
    nome: 'gvbthepluggg',
    url: 'https://feeds.soundcloud.com/users/soundcloud:users:851749639/sounds.rss'
  },
  {
    nome: 'MARANGUAPEBOYZ',
    url: 'https://feeds.soundcloud.com/users/soundcloud:users:1694143418/sounds.rss'
  }
];

// ======================================
// PROXY
// ======================================

const proxies = [
  url => 'https://proxy.cors.dev/' + url
];

// ======================================
// BAIXAR XML
// ======================================

async function baixarXML(feedUrl) {

  for (const montarProxy of proxies) {

    try {

      const resposta = await fetch(montarProxy(feedUrl), {
        cache: 'no-store',
        credentials: 'omit'
      });

      if (!resposta.ok) {
        console.warn('Erro HTTP:', resposta.status);
        continue;
      }

      const texto = await resposta.text();

      const parser = new DOMParser();

      const xml = parser.parseFromString(
        texto,
        'text/xml'
      );

      if (
        !xml.querySelector('parsererror') &&
        xml.querySelector('channel')
      ) {
        return xml;
      }

    } catch (erro) {

      console.error('Falha ao acessar RSS:', erro);

    }

  }

  return null;
}

// ======================================
// EXTRAIR TEXTO
// ======================================

function extrairTexto(item, seletor) {

  return item.getElementsByTagName(seletor)[0]
    ?.textContent?.trim() || '';

}

// ======================================
// CARREGAR LANÇAMENTOS
// ======================================

async function carregarLancamentos() {

  const container = document.getElementById(
    'feed-lancamentos'
  );

  container.innerHTML = '<p>Atualizando lançamentos...</p>';

  let todasAsFaixas = [];

  const resultados = await Promise.all(

    feedsRSS.map(async feed => {

      const xml = await baixarXML(feed.url);

      if (!xml) {

        console.error(
          'Não foi possível carregar:',
          feed.nome
        );

        return {
          artista: feed.nome,
          faixas: [],
          erro: true
        };

      }

      const itens = xml.querySelectorAll('item');

      const faixas = Array.from(itens).map(item => {

        const titulo = extrairTexto(item, 'title');

        const link = extrairTexto(item, 'link');

        const pubDate = extrairTexto(item, 'pubDate');

        const autorRSS =
          extrairTexto(item, 'itunes:author') ||
          extrairTexto(item, 'dc:creator');

        const imagemTag =
          item.getElementsByTagName('itunes:image')[0];

        let capa = imagemTag
          ? imagemTag.getAttribute('href')
          : '';

        if (capa) {
          capa = capa.replace(
            '-t3000x3000.',
            '-large.'
          );
        }

        return {
          titulo,
          link,
          pubDate,
          autor: autorRSS || feed.nome,
          capa,
          perfil: feed.nome
        };

      }).filter(faixa => faixa.link);

      console.log(
        '[' + feed.nome + '] ' +
        faixas.length +
        ' músicas encontradas'
      );

      return {
        artista: feed.nome,
        faixas,
        erro: false
      };

    })

  );

  // ======================================
  // JUNTAR OS QUATRO ARTISTAS
  // ======================================

  resultados.forEach(resultado => {

    todasAsFaixas.push(...resultado.faixas);

  });

  const falhas = resultados.filter(
    resultado => resultado.erro
  );

  if (todasAsFaixas.length === 0) {

    container.innerHTML =
      '<p>Não foi possível carregar os lançamentos. Tentando novamente...</p>';

    return;

  }

  // ======================================
  // REMOVER DUPLICADOS
  // ======================================

  const unicas = new Map();

  todasAsFaixas.forEach(faixa => {

    unicas.set(faixa.link, faixa);

  });

  todasAsFaixas = Array.from(unicas.values());

  // ======================================
  // ORDENAR POR DATA
  // ======================================

  todasAsFaixas.sort((a, b) => {

    const dataA = new Date(a.pubDate).getTime() || 0;

    const dataB = new Date(b.pubDate).getTime() || 0;

    return dataB - dataA;

  });

  // ======================================
  // EXIBIR LANÇAMENTOS
  // ======================================

  container.innerHTML = '';

  const status = document.createElement('div');

  status.className = 'status-feed';

  status.textContent = falhas.length
    ? 'ATENÇÃO: ' + falhas.length + ' FEED(S) COM ERRO'
    : 'FEED ATUALIZADO AUTOMATICAMENTE';

  container.appendChild(status);

  todasAsFaixas.slice(0, 30).forEach(faixa => {

    const card = document.createElement('div');

    card.className = 'faixa-card';

    // CAPA

    if (faixa.capa) {

      const img = document.createElement('img');

      img.src = faixa.capa;

      img.alt = 'Capa de ' + faixa.titulo;

      img.loading = 'lazy';

      card.appendChild(img);

    }

    // ARTISTA

    const autor = document.createElement('div');

    autor.className = 'faixa-autor';

    autor.textContent = faixa.autor;

    card.appendChild(autor);

    // TÍTULO

    const titulo = document.createElement('div');

    titulo.className = 'faixa-titulo';

    titulo.textContent = faixa.titulo;

    card.appendChild(titulo);

    // DATA

    if (faixa.pubDate) {

      const data = document.createElement('div');

      data.className = 'faixa-data';

      const dataPublicacao = new Date(faixa.pubDate);

      data.textContent = isNaN(dataPublicacao.getTime())
        ? ''
        : dataPublicacao.toLocaleDateString('pt-BR');

      card.appendChild(data);

    }

    // PLAYER SOUNDCLOUD

    const iframe = document.createElement('iframe');

    iframe.width = '100%';

    iframe.height = '20';

    iframe.scrolling = 'no';

    iframe.frameBorder = 'no';

    iframe.allow = 'autoplay';

    iframe.src =
      'https://w.soundcloud.com/player/?url=' +
      encodeURIComponent(faixa.link) +
      '&color=%23ff5500' +
      '&inverse=true' +
      '&auto_play=false' +
      '&show_user=false';

    card.appendChild(iframe);

    container.appendChild(card);

  });

  // ======================================
  // AVISAR SOBRE FEEDS COM ERRO
  // ======================================

  falhas.forEach(resultado => {

    const aviso = document.createElement('div');

    aviso.className = 'erro-feed';

    aviso.textContent =
      'Não foi possível consultar: ' +
      resultado.artista;

    container.appendChild(aviso);

  });

}

// ======================================
// INICIALIZAÇÃO
// ======================================

carregarLancamentos();

// Atualizar a cada 5 minutos

setInterval(
  carregarLancamentos,
  5 * 60 * 1000
);

</script>

</body>
</html>
