<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    color: white;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 12px;
  }
  .faixa-card {
    background: rgba(0, 0, 0, 0.75);
    border: 2px ridge #ccc;
    padding: 8px;
    margin-bottom: 12px;
    text-align: center;
  }
  .faixa-card img {
    width: 100px;
    height: 100px;
    object-fit: cover;
    border: 2px double white;
    margin-bottom: 6px;
  }
  .faixa-titulo {
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    margin: 4px 0;
    word-wrap: break-word;
  }
  .faixa-autor {
    font-size: 11px;
    color: #00ffff;
    margin-bottom: 6px;
  }
  /* Barra de rolagem fina combinando com o site */
  * { scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 8px; }
</style>
</head>
<body>
  <div id="feed-lancamentos" style="text-align: center;">Carregando lançamentos...</div>

  <script>
    // Todos os 4 feeds oficiais do Maranguapeboyz
    const feedsRSS = [
      'https://feeds.soundcloud.com/users/soundcloud:users:317924305/sounds.rss',  // santacruz4life / igniskpt
      'https://feeds.soundcloud.com/users/soundcloud:users:1353337512/sounds.rss', // marquinhos ak trovão
      'https://feeds.soundcloud.com/users/soundcloud:users:851749639/sounds.rss',  // gvbthepluggg
      'https://feeds.soundcloud.com/users/soundcloud:users:1694143418/sounds.rss'  // MARANGUAPEBOYZ*
    ];

    const proxies = [
  url => 'https://codetabs.com' + encodeURIComponent(url)
];


    async function baixarXML(feedUrl) {
      for (const montarProxy of proxies) {
        try {
          const resposta = await fetch(montarProxy(feedUrl));
          if (resposta.ok) {
            const texto = await resposta.text();
            if (texto.includes('<rss') && texto.includes('<item>')) {
              return texto;
            }
          }
        } catch (e) {}
      }
      return null;
    }

    async function carregarLancamentos() {
      const container = document.getElementById('feed-lancamentos');
      let todasAsFaixas = [];

      // Baixa os 4 feeds ao mesmo tempo para carregar mais rápido
      const resultadosXML = await Promise.all(feedsRSS.map(url => baixarXML(url)));

      resultadosXML.forEach(xmlTexto => {
        if (!xmlTexto) return;

        const parser = new DOMParser();
        const xml = parser.parseFromString(xmlTexto, 'text/xml');
        const itens = xml.querySelectorAll('item');

        // Pega apenas as 5 mais recentes de cada perfil para não pesar o navegador
        Array.from(itens).slice(0, 5).forEach(item => {
          const titulo = item.querySelector('title')?.textContent || 'Sem título';
          const link = item.querySelector('link')?.textContent || '';
          const pubDate = item.querySelector('pubDate')?.textContent || '';

          const itunesAuthor = item.getElementsByTagName('itunes:author')[0];
          const autor = itunesAuthor ? itunesAuthor.textContent : 'Maranguapeboyz';

          const itunesImg = item.getElementsByTagName('itunes:image')[0];
          // Troca o tamanho t3000x3000 por large para carregar as capas instantaneamente
          let capa = itunesImg ? itunesImg.getAttribute('href') : '';
          if (capa) {
            capa = capa.replace('-t3000x3000.', '-large.');
          }

          if (link) {
            todasAsFaixas.push({ titulo, link, pubDate, autor, capa });
          }
        });
      });

      if (todasAsFaixas.length === 0) {
        container.innerHTML = '<p>Nenhum lançamento encontrado no momento.</p>';
        return;
      }

      // Ordena da faixa mais recente para a mais antiga
      todasAsFaixas.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

      container.innerHTML = '';
      // Exibe os 10 lançamentos mais novos do grupo todo
      todasAsFaixas.slice(0, 10).forEach(faixa => {
        const imgTag = faixa.capa ? `<img src="${faixa.capa}" alt="Capa">` : '';
        const playerHtml = `
          <div class="faixa-card">
            ${imgTag}
            <div class="faixa-autor">${faixa.autor}</div>
            <div class="faixa-titulo">${faixa.titulo}</div>
            <iframe width="100%" height="20" scrolling="no" frameborder="no" allow="autoplay" src="https://soundcloud.com{encodeURIComponent(faixa.link)}&color=%23ff5500&inverse=true&auto_play=false&show_user=false">
            </iframe>
          </div>
        `;
        container.innerHTML += playerHtml;
      });
    }

    carregarLancamentos();
  </script>
</body>
</html>
